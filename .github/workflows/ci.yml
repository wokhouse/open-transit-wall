name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  server:
    name: Server lint + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r server/requirements-dev.txt
      - name: Ruff
        run: ruff check server tools
      - name: Pytest
        # Fixture-based: no 511 API key needed.
        run: python -m pytest server/tests -q

  firmware:
    name: Firmware cppcheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck
      # Mirrors `pio check -e esp32dev` (platformio.ini: --suppress=unusedFunction,
      # firmware sources only).
      - name: cppcheck
        run: cppcheck --quiet --error-exitcode=1 --suppress=unusedFunction firmware/src firmware/include
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PlatformIO Core
        run: pip install -U platformio
      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}
      - name: Build firmware
        run: pio run -e esp32dev
