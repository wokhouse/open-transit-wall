name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  server:
    name: Server lint + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r server/requirements-dev.txt
      - name: Ruff
        run: ruff check server tools
      - name: Pytest
        # Fixture-based: no 511 API key needed.
        run: python -m pytest server/tests -q

  firmware:
    name: Firmware cppcheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck
      # Mirrors `pio check -e s3rgbmatrix` (platformio.ini: --suppress=unusedFunction,
      # firmware sources only). The -I flags replicate the include paths pio check
      # passes automatically — screen.h includes config.h from firmware/include.
      - name: cppcheck
        run: cppcheck --quiet --error-exitcode=1 --suppress=unusedFunction -I firmware/include -I firmware/src firmware/src firmware/include
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PlatformIO Core
        # intelhex: tool-esptoolpy 2.41100 (pulled by espressif32 7.1.3-dev)
        # imports it but declares no Python dependencies, so PlatformIO
        # never installs it.
        run: pip install -U platformio intelhex
      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          # v2 key: the old key carried a stale espressif32 platform; the
          # pin in platformio.ini is part of the key so bumps rebuild.
          key: pio-v2-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}
      - name: Build firmware
        # One binary, no build-time secrets: WiFi/proxy settings are
        # provisioned at runtime over WebSerial (docs/provisioning-protocol.md).
        run: pio run -d firmware -e s3rgbmatrix -e matrixportal-s3
