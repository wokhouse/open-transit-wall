; open-transit-wall firmware — ESP32-WROOM-32E + Waveshare RGB-Matrix-Px-64x32
;
; Build:      pio run -e esp32dev
; Flash:      pio run -e esp32dev -t upload
; Monitor:    pio run -e esp32dev -t monitor
;
; Native simulator (no hardware) is built with plain clang/g++ — see tools/run_sim.sh.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; test_pattern.cpp is built by [env:testpattern] only
build_src_filter = +<*> -<test_pattern.cpp>
build_flags =
    ; HUB75 panels are bright; cap brightness in code (config.h), this avoids flicker flags
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    mrfaptastic/ESP32 HUB75 LED MATRIX PANEL DMA Display@^3.0.15
    adafruit/Adafruit GFX Library@^1.11.11
    bblanchon/ArduinoJson@^7.0.4

[env:testpattern]
; full-panel r->g->b cycling test (firmware/src/test_pattern.cpp); restore the
; transit firmware with: pio run -e esp32dev -t upload
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=1
build_src_filter = -<*> +<test_pattern.cpp>
lib_deps =
    mrfaptastic/ESP32 HUB75 LED MATRIX PANEL DMA Display@^3.0.15
    adafruit/Adafruit GFX Library@^1.11.11
