; open-transit-wall firmware — ESP32-S3 HUB75 driver boards
;
; Targets:
;   pio run -e s3rgbmatrix       Waveshare ESP32-S3-RGB-Matrix (default)
;   pio run -e matrixportal-s3   Adafruit MatrixPortal S3
; Flash:   ... -t upload      Monitor: ... -t monitor
;
; One binary for every wall: WiFi + proxy host are provisioned at runtime
; over WebSerial (docs/provisioning-protocol.md). No secrets.h, and no
; compiled defaults — the binary carries no network configuration at all.
;
; Native simulator (no hardware) is built with plain clang/g++ — see tools/run_sim.sh.

[env:s3rgbmatrix]
; Waveshare ESP32-S3-RGB-Matrix (ESP32-S3-WROOM-1-N32R16, onboard HUB75
; driver): https://www.waveshare.com/esp32-s3-rgb-matrix.htm
; The devkitc-1 board def matches the module; flash size is overridden to the
; 32 MB (N32R16) part. The board's only console is its native USB-C, so CDC
; on boot is on — the web flasher talks to it over WebSerial like before.
; Pinned: the Arduino core's TLS API differs between major platforms
; (setCACert returns bool on 2.x cores, void + lastError(buf) on 3.x).
; Keep this in sync with the CI cache key.
platform = espressif32@7.1.3
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 32MB
; The N32R16 module's 32MB flash is octal (OPI), shared with the octal PSRAM:
; the ROM boots it in "Octal Flash Mode" (eFuse). The devkitc-1 default
; qio_qspi makes esp_flash_init assert in do_core_init and the app crash-
; loops before setup(). N32R16 needs the opi_opi memory type.
board_build.arduino.memory_type = opi_opi
monitor_speed = 115200
; test_pattern.cpp is built by [env:testpattern] only
build_src_filter = +<*> -<test_pattern.cpp>
; static analysis (pio check -e s3rgbmatrix) — skip vendored libraries; their
; preprocessor tricks trip cppcheck. Checks firmware/src + include only.
check_skip_packages = yes
; setup()/loop() are Arduino entry points, not dead code
check_flags = cppcheck: --suppress=unusedFunction
build_flags =
    ; HUB75 panels are bright; cap brightness in code (config.h), this avoids flicker flags
    -DCORE_DEBUG_LEVEL=1
    ; route Serial to the S3 native USB (the USB-C port on the board)
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    mrfaptastic/ESP32 HUB75 LED MATRIX PANEL DMA Display@^3.0.15
    adafruit/Adafruit GFX Library@^1.11.11
    bblanchon/ArduinoJson@^7.0.4

[env:matrixportal-s3]
; Adafruit MatrixPortal S3 (ESP32-S3, 8 MB flash, front HUB75 connector):
; https://www.adafruit.com/product/5778
; Same firmware, different HUB75 map (config.h, -DOTW_BOARD_MATRIXPORTAL_S3).
; The board def uses the qio_qspi memory type — PSRAM stays off, which this
; board requires: its panel lines sit on GPIO35-37.
extends = env:s3rgbmatrix
board = adafruit_matrixportal_esp32s3
board_build.flash_size = 8MB
; undo the inherited OPI flash type: MatrixPortal S3 is a standard quad-flash
; module (its board def uses qio_qspi; PSRAM stays off — panel lines on 35-37)
board_build.arduino.memory_type = qio_qspi
build_flags = ${env:s3rgbmatrix.build_flags}
    -DOTW_BOARD_MATRIXPORTAL_S3

[env:testpattern]
; full-panel r->g->b cycling test (firmware/src/test_pattern.cpp); restore the
; transit firmware with: pio run -e s3rgbmatrix -t upload
extends = env:s3rgbmatrix
build_src_filter = -<*> +<test_pattern.cpp>
